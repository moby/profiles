name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  project-checks:
    name: Project Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "stable"

    - name: Install ltag
      run: go install github.com/containerd/ltag@latest

    - name: Run file header checks
      run: ltag --check -t "./script/validate/template" -v

  crossbuild:
    name: Cross Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "oldstable", "stable"]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cross build
      run: make crossbuild

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "oldstable", "stable"]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install AppArmor tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq -o Dpkg::Use-Pty=0 apparmor apparmor-utils

    - name: Run tests
      run: make test

    - name: Run tests as root
      env:
        TEST_AS_ROOT: 1
      run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable

    - name: golangci-lint (apparmor)
      id: lint-apparmor
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: latest
        working-directory: apparmor
      continue-on-error: true

    - name: golangci-lint (seccomp)
      id: lint-seccomp
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: latest
        working-directory: seccomp
      continue-on-error: true

    - name: Check lint results
      if: steps.lint-apparmor.outcome == 'failure' || steps.lint-seccomp.outcome == 'failure'
      run: |
        echo "One or more lint checks failed"
        exit 1

  check-codegen:
    name: Check seccomp code generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Validate seccomp code generation
        run: make validate-codegen

  moby:
    name: Test with Moby master
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: profiles

    - name: Checkout Moby
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: moby/moby
        ref: master
        path: moby

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: moby/go.mod
        cache-dependency-path: moby/go.sum

    - name: Use profiles from this checkout
      working-directory: moby
      run: |
        go mod edit \
          -replace github.com/moby/profiles/apparmor=../profiles/apparmor \
          -replace github.com/moby/profiles/seccomp=../profiles/seccomp
        go mod tidy
        go mod vendor

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Moby development image
      uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
      with:
        source: ./moby
        targets: dev
        load: true
        set: |
          dev.cache-from=type=gha,scope=moby-dev-amd64
          dev.cache-to=type=gha,scope=moby-dev-amd64,mode=max

    # Moby only logs a failure to load docker-default and then reuses any
    # profile already loaded under that name, such as the one the runner's
    # own Docker installed. Unload it so a profile from this checkout that
    # fails to load makes the tests fail instead of being masked.
    - name: Unload the runner's docker-default AppArmor profile
      run: |
        if sudo grep -q '^docker-default ' /sys/kernel/security/apparmor/profiles; then
          echo -n docker-default | sudo tee /sys/kernel/security/apparmor/.remove > /dev/null
        fi

    - name: Run Moby seccomp and AppArmor integration tests
      working-directory: moby
      env:
        TEST_INTEGRATION_DIR: ./integration/security
        TEST_SKIP_INTEGRATION_CLI: 1
      run: make -o build test-integration
